# Lightweight dev compose for AgentKit — runs in the agentkit Lightning Studio.
# Runs the MCP server over SSE on port 8005.
# Bridge to Claude Desktop on the laptop via: npx mcp-remote http://localhost:8005/sse
#
# Usage inside the Studio:
#   docker compose -f docker-compose.dev.yml up --build
#
# Reach it from the laptop: ssh -L 8005:localhost:8005 lightning-agentkit
# Claude Desktop config: { "command": "npx", "args": ["-y","mcp-remote","http://localhost:8005/sse"] }

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentkit:dev
    volumes:
      - ./core:/app/core
      - ./services:/app/services
      - ./db:/app/db
      - ./mcp_server.py:/app/mcp_server.py
      - ./workflow.py:/app/workflow.py
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    ports:
      - "8005:8005"
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      MCP_TRANSPORT: sse
      MCP_PORT: "8005"
    command: python mcp_server.py
    restart: unless-stopped
