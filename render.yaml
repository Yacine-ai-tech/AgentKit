# Render Blueprint — disaster-recovery / one-click redeploy. Builds from ./Dockerfile (honors $PORT),
# health-checks /health. No secrets here: every key is `sync: false` (set values in the dashboard).
# MCP server over SSE (FastMCP). MCP_TRANSPORT=sse is forced so the /sse endpoint is exposed for
# remote MCP clients (Claude Desktop via mcp-remote). Set MCP_AUTH_TOKEN to require bearer auth.
services:
  - type: web
    name: agentkit
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    autoDeploy: false
    envVars:
      - key: MCP_TRANSPORT
        value: sse
      - key: POSTGRES_URL          # Neon — the tools serve REAL KPI data from here
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MCP_AUTH_TOKEN        # bearer token gating the SSE endpoint (recommended)
        sync: false
      - key: OMNIINTEL_INTERNAL_TOKEN  # REQUIRED: must match gateway
        value: REDACTED_SECRET
      - key: REQUIRE_INTERNAL_TOKEN
        value: "true"
