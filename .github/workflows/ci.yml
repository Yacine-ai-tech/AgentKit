name: AgentKit CI & Deploy

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]
  schedule:
    - cron: "0 3 * * *"   # Nightly smoke test at 03:00 UTC
  workflow_dispatch:        # Allow manual trigger

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION:   "20"
  AGENTKIT_URL:    ${{ secrets.AGENTKIT_URL   || '' }}
  AGENTKIT_INTERNAL_TOKEN: ${{ secrets.AGENTKIT_INTERNAL_TOKEN  }}
  TELEMETRY_OPT_OUT: "false"

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 1 — Test: Run Python tests and linting
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    name: "Python Tests & Linting"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      
      - name: Run tests
        run: |
          # test_exhaustive_api.py needs a live server (TEST_BASE_URL) — it runs against the
          # deployed service in the E2E Smoke Tests job below, not here against nothing.
          pytest tests/ -v --tb=short --ignore=tests/test_exhaustive_api.py
      
      - name: Check code style
        run: |
          pip install flake8
          flake8 src/   # config in .flake8 (keeps local == CI)

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 2 — Frontend Tests
  # ═════════════════════════════════════════════════════════════════════════
  frontend-test:
    name: "Frontend Tests"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm ci
      
      - name: Run frontend tests
        working-directory: ./frontend
        run: |
          npm test -- --passWithNoTests

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 3 — E2E Smoke Tests (against deployed service)
  # ═════════════════════════════════════════════════════════════════════════
  e2e-smoke:
    name: "E2E Smoke Tests"
    runs-on: ubuntu-latest
    needs: [test, frontend-test]
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pytest pytest-asyncio

      - name: Health check
        run: |
          python -c "
          import httpx
          response = httpx.get('${{ env.AGENTKIT_URL }}/health', timeout=10)
          print(f'Health check: {response.status_code}')
          assert response.status_code == 200
          print(f'Response: {response.json()}')
          "

      - name: Run exhaustive API tests against live deployment
        if: env.AGENTKIT_URL != ''
        env:
          TEST_BASE_URL: ${{ env.AGENTKIT_URL }}
          AGENTKIT_INTERNAL_TOKEN: ${{ env.AGENTKIT_INTERNAL_TOKEN }}
        run: |
          pytest tests/test_exhaustive_api.py -v --tb=short
      
      - name: Endpoint availability test
        run: |
          python -c "
          import httpx
          headers = {'X-AgentKit-Internal-Token': '${{ env.AGENTKIT_INTERNAL_TOKEN }}'}
          
          # Test health endpoint
          response = httpx.get('${{ env.AGENTKIT_URL }}/health', timeout=10)
          print(f'Health: {response.status_code}')
          
          # Test SSE endpoint
          response = httpx.get('${{ env.AGENTKIT_URL }}/sse', timeout=10)
          print(f'SSE: {response.status_code}')
          
          print('All endpoints accessible')
          "


