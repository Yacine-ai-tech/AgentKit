# Reference ACTION pack — shows AgentKit doing more than reading.
#
# An analyst agent that can only read produces opinions nobody can act on. These tools
# let an agent record what it found back into the system of record: annotate a metric,
# then (with human approval) retract an annotation it got wrong.
#
# Every tool here is gated. Nothing in this file can run unless the operator has set
# AGENTKIT_ALLOW_WRITES=true, and `retract_annotation` additionally needs a human-held
# AGENTKIT_APPROVAL_TOKEN — see core/policy.py.
#
# Table (created by scripts/init_annotations.sql):
#   kpi_annotations(id, metric, period, note, severity, author, created_at, retracted_at)

name: annotations
description: >
  Write-back annotations on KPI metrics — lets an agent record findings, not just report
  them. Demonstrates AgentKit's guarded action path (effects, scopes, dry-run, approval).

datasource:
  type: postgres
  url_env: POSTGRES_URL

tools:
  - name: list_annotations
    description: >
      Read historical metric annotations, corrections, and operator notes, ordered from most recent to oldest.
      Allows filtering by a specific KPI metric, business domain, and optionally including retracted entries.
    effect: read
    params:
      - {name: domain, type: string, required: false, description: "Optional business domain to filter annotations by (e.g. 'engineering', 'finance', 'product', 'sales'). Omit or pass null to query across all domains."}
      - {name: metric, type: string, required: false, description: "Optional KPI metric name to filter annotations by (e.g. 'revenue', 'gross_margin'). Omit or pass null to query across all metrics."}
      - {name: include_retracted, type: boolean, required: false, default: false, description: "Whether to include soft-deleted / retracted annotations in the returned results. Defaults to false."}
      - {name: limit, type: integer, required: false, default: 50, description: "Maximum number of annotation records to return. Defaults to 50 (range: 1 to 200)."}
    query: >
      SELECT id, metric, period, note, severity, author, domain, created_at, retracted_at
      FROM kpi_annotations
      WHERE (%(metric)s::text IS NULL OR metric = %(metric)s::text)
        AND (%(domain)s::text IS NULL OR %(domain)s::text IN ('all', 'global', '*', '') OR domain = %(domain)s::text)
        AND (%(include_retracted)s::boolean OR retracted_at IS NULL)
      ORDER BY created_at DESC
      LIMIT %(limit)s

  - name: annotate_metric
    description: >
      Attach a durable operational finding, investigation note, root-cause explanation, or correction to a specific KPI metric, business domain, or recording period.
      Requires write permissions enabled.
    effect: write
    scopes: [annotations.write]
    rate_limit: 30
    params:
      - {name: domain, type: string, required: false, description: "Business domain the metric or annotation belongs to (e.g. 'engineering', 'finance', 'product', 'sales')."}
      - {name: metric, type: string, required: false, default: general, description: "Canonical name of the metric being annotated (e.g. 'revenue', 'gross_margin', 'headcount', 'deploy_latency'). Defaults to 'general'."}
      - {name: period, type: string, required: false, description: "Target recording period for the annotation in YYYY-MM format (e.g. '2026-10'). Defaults to current month if omitted."}
      - {name: note, type: string, required: true, description: "Detailed contextual explanation, root cause analysis, correction, or operational finding."}
      - {name: severity, type: string, required: false, default: info, description: "Operational impact classification level: 'info', 'warning', or 'critical'. Defaults to 'info'."}
      - {name: author, type: string, required: false, default: agentkit, description: "Identifier of the agent or human user recording the annotation. Defaults to 'agentkit'."}
    statement: >
      INSERT INTO kpi_annotations (metric, period, note, severity, author, domain)
      VALUES (
        COALESCE(%(metric)s, %(domain)s, 'general'),
        COALESCE(%(period)s, to_char(NOW(), 'YYYY-MM')),
        %(note)s,
        COALESCE(%(severity)s, 'info'),
        COALESCE(%(author)s, 'agentkit'),
        %(domain)s
      )

  - name: retract_annotation
    description: >
      Soft-delete an erroneous or outdated annotation (stamps retracted_at).
      Classed as a destructive action requiring a valid operator approval token.
    effect: destructive
    scopes: [annotations.write]
    rate_limit: 10
    params:
      - {name: annotation_id, type: integer, required: true, description: "Unique integer ID of the specific annotation record to soft-delete/retract."}
    statement: >
      UPDATE kpi_annotations SET retracted_at = NOW()
      WHERE id = %(annotation_id)s AND retracted_at IS NULL
