# Railway deploy descriptor for the AgentKit MCP server.
# MCP_TRANSPORT=sse makes it serve HTTP/SSE; it binds to the platform-injected $PORT.
# Set MCP_AUTH_TOKEN in the Railway dashboard to enable bearer auth on the SSE endpoint.
[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "env MCP_TRANSPORT=sse python mcp_server.py"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
