[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkit-mcp"
version = "0.1.11"
description = "AgentKit MCP Server — a generic, policy-gated MCP server for Claude/Cursor agents; ships with a business-intelligence reference pack."
readme = "README.md"
license = { text = "AGPL-3.0" }
requires-python = ">=3.10"
authors = [{ name = "Yacine" }]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
    "fastmcp",
    "psycopg2-binary",
    "uvicorn",
    "python-dotenv",
    "pyyaml"
]

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentkit_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
